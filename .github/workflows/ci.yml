name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Format, validate and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # The root module declares an S3 backend, so init is run with -backend=false:
      # validation needs the providers and the module tree, not remote state.
      - name: Validate root module
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate topics module
        working-directory: modules/topics
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate examples
        run: |
          for dir in examples/*/; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: tflint --recursive

  security:
    name: Static security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Fail on committed state, plans or credentials
        run: |
          set -eu
          fail=0

          if git ls-files | grep -E '\.tfstate|\.tfplan|^tfplan$|terraform\.tfvars$|^backend\.hcl$'; then
            echo "State, plan, tfvars or backend config is tracked. Remove it." >&2
            fail=1
          fi

          # Static AWS keys and Confluent secrets must never appear in tracked files.
          if git grep -nIE '(AKIA|ASIA)[0-9A-Z]{16}' -- . ; then
            echo "An AWS access key id is present in a tracked file." >&2
            fail=1
          fi

          if git grep -nIE '(access_key|secret_key|api_secret|cloud_api_secret)[[:space:]]*=[[:space:]]*"[^"$]{8,}"' \
               -- '*.tf' '*.hcl' ; then
            echo "A credential looks hardcoded in a Terraform file." >&2
            fail=1
          fi

          exit "$fail"

  # Planning needs real Confluent Cloud credentials, so it does not run on pull
  # requests from forks. Deployment is a manual, environment-gated workflow rather
  # than an auto-apply on merge: `terraform apply -auto-approve` on push to a
  # branch is how topics get deleted by accident.
  plan:
    name: Plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate, security]
    environment: dev

    permissions:
      contents: read
      id-token: write # assume the state-bucket role via OIDC, no static AWS keys

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STATE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Init with remote state
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Plan
        env:
          TF_VAR_confluent_cloud_api_key: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
          TF_VAR_confluent_cloud_api_secret: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -var environment="${{ vars.CONFLUENT_ENVIRONMENT }}" \
            -var cluster_name="${{ vars.CONFLUENT_CLUSTER_NAME }}"
